<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Permitra – Sicherheitsregeln</title>
    <script>
      /* Apply the stored theme choice BEFORE the app renders - otherwise
         the light theme briefly flashes up while loading. */
      try {
        var t = localStorage.getItem('permitra_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
