# The rate limit for the sign-in is generated at startup into
# conf.d/05-ratelimit.conf from PERMITRA_LOGIN_RATE (see
# docker-entrypoint.d/10-ratelimit.sh). It lives outside this file because the
# right value depends on the deployment: behind a corporate NAT every user
# shares one address, so the limit applies to the whole office at once.
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # The resolution of the real client address lives in conf.d/10-realip.conf
    # and is generated at startup from PERMITRA_TRUSTED_PROXIES (see
    # docker-entrypoint.d/20-realip.sh). If the variable is not set, NO
    # X-Forwarded-For is evaluated – only the actual peer counts then, which
    # cannot be forged.

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version in every response.
    server_tokens off;

    # Security headers, set once for every response below.
    #
    # HSTS is deliberately NOT set here: this container speaks plain HTTP and
    # expects TLS to terminate in front of it. A max-age sent over HTTP is
    # ignored by browsers at best, and pins a host to HTTPS it may not serve at
    # worst. Set it on the terminating proxy, where the certificate is.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # The session token lives in localStorage, so script injection is the way it
    # gets stolen - which is what this policy is for. 'unsafe-inline' on styles
    # is required by the inline styles the interface uses; scripts do not get
    # it. connect-src stays 'self': the frontend only ever talks to its own
    # /api, and anything else would be exfiltration.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # React router: route all paths to index.html
    location / {
        try_files $uri /index.html;
        # Never cache index.html, so new deployments take effect immediately.
        # add_header inside a location replaces the ones above, so the security
        # headers have to be repeated here - nginx does not merge them.
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Vite assets carry a content hash in their name and may be cached for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The sign-in gets the rate limit; everything else stays unthrottled so
    # normal work is never slowed down.
    location = /api/auth/login {
        limit_req zone=permitra_login burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Forward the API to the backend
    location /api/ {
        # An upload of the actual configuration can legitimately be large; a
        # bounded value still keeps a single request from filling the disk.
        client_max_body_size 8m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Deliberately OVERWRITE instead of appending: the application evaluates
        # the first entry, and thanks to set_real_ip_from above $remote_addr is
        # already the verified real client address. With $proxy_add_x_forwarded_for
        # a value made up freely by the client would be in front instead.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
