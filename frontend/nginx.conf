server {
    listen 80;
    server_name _;

    # Die Ermittlung der echten Client-Adresse steht in conf.d/10-realip.conf
    # und wird beim Start aus PERMITRA_TRUSTED_PROXIES erzeugt (siehe
    # docker-entrypoint.d/20-realip.sh). Ohne gesetzte Variable wird KEIN
    # X-Forwarded-For ausgewertet – dann gilt allein die tatsächliche
    # Gegenstelle, die sich nicht fälschen lässt.

    root /usr/share/nginx/html;
    index index.html;

    # React-Router: alle Pfade auf index.html
    location / {
        try_files $uri /index.html;
        # index.html nie cachen, damit neue Deployments sofort greifen
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Vite-Assets tragen einen Content-Hash im Namen und dürfen lange gecacht werden
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API an das Backend weiterreichen
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Bewusst ÜBERSCHREIBEN statt anhängen: die Anwendung wertet den ersten
        # Eintrag aus, und $remote_addr ist dank set_real_ip_from oben bereits
        # die geprüfte echte Client-Adresse. Mit $proxy_add_x_forwarded_for
        # stünde stattdessen ein frei erfundener Wert des Clients vorn.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
