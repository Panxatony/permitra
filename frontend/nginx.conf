server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React-Router: alle Pfade auf index.html
    location / {
        try_files $uri /index.html;
        # index.html nie cachen, damit neue Deployments sofort greifen
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Vite-Assets tragen einen Content-Hash im Namen und dürfen lange gecacht werden
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API an das Backend weiterreichen
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
