# CI pipeline for Permitra.
#
# Goal: every change is checked automatically before it is deployed –
# tests including the permission checks, linting, known vulnerabilities in the
# dependencies and a build of both images.
#
# The backend test runs twice: once quickly against SQLite and once against a
# real PostgreSQL instance including the Alembic migrations – that is where
# migration and dialect errors surface which SQLite does not reveal.

stages:
  - lint
  - test
  - security
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  GIT_DEPTH: "20"

default:
  interruptible: true

# ---------------------------------------------------------------- lint

ruff:
  stage: lint
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  before_script:
    - pip install --quiet ruff
  script:
    # Rules and exceptions live in backend/ruff.toml - the default rule set
    # drowns real findings in FastAPI idiom (Depends in default arguments).
    - cd backend && ruff check . --output-format=concise
  # Blocking: the rule set is tuned to this project and the tree is clean,
  # so a new finding is a real one and should stop the pipeline.

# ---------------------------------------------------------------- test

backend-tests:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  variables:
    PERMITRA_DEV: "1"          # random per-process secret instead of a real SECRET_KEY
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libpq-dev >/dev/null
    - pip install --quiet -r backend/requirements-dev.txt
  script:
    - cd backend
    - python -m pytest tests/ -q --cov=app --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: backend/report.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 1 week

# Against real PostgreSQL including migrations: catches errors that SQLite hides
# (dialect differences, faulty Alembic steps, advisory locks).
migrations-postgres:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: permitra_ci
    POSTGRES_USER: permitra
    POSTGRES_PASSWORD: ci-only-not-secret
    DATABASE_URL: "postgresql+psycopg2://permitra:ci-only-not-secret@postgres:5432/permitra_ci"
    PERMITRA_DEV: "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libpq-dev >/dev/null
    - pip install --quiet -r backend/requirements-dev.txt
  script:
    - cd backend
    # 1) Apply migrations from scratch
    - 'python -c "from app.migrations import run_migrations; run_migrations(); print(chr(10) + \"Migrations applied\")"'
    # 2) Smoke test of the audit chain on real Postgres (advisory lock path, #26)
    - |
      python - <<'PY'
      from app.database import SessionLocal
      from app import audit
      db = SessionLocal()
      for i in range(25):
          audit.record(db, "admin", "ci.check", actor="ci", object=f"o{i}", detail="x")
      result = audit.verify_chain(db)
      assert result["ok"], f"hash chain broken: {result}"
      assert result["checked"] == 25, result
      print("Audit hash chain on PostgreSQL: ok")
      db.close()
      PY

frontend-build:
  stage: test
  image: node:22-alpine
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [.cache/npm]
  before_script:
    - cd frontend && npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run build
  artifacts:
    paths: [frontend/dist]
    expire_in: 1 week

# ---------------------------------------------------------------- security

dependency-audit:
  stage: security
  image: python:3.12-slim
  before_script:
    - pip install --quiet pip-audit
  script:
    - pip-audit -r backend/requirements.txt --progress-spinner off
  allow_failure: true   # reports vulnerabilities but does not block the deployment

npm-audit:
  stage: security
  image: node:22-alpine
  script:
    - cd frontend && npm audit --audit-level=high
  allow_failure: true

# No secret must accidentally end up in the repository.
secret-scan:
  stage: security
  image: python:3.12-slim
  before_script:
    # The slim image ships without git, but the scan needs `git ls-files`
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null
  script:
    - |
      python - <<'PY'
      import re, subprocess, sys
      # Check tracked files – .env & co. are ignored anyway
      files = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
      patterns = [
          (re.compile(r"SECRET_KEY\s*[:=]\s*['\"][A-Za-z0-9+/=_-]{16,}"), "hard-coded SECRET_KEY"),
          (re.compile(r"(?i)(password|passwort)\s*[:=]\s*['\"][^'\"]{8,}"), "hard-coded password"),
          (re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"), "private key"),
          (re.compile(r"\bglpat-[A-Za-z0-9_-]{20,}"), "GitLab token"),
      ]
      # Not real secrets: shell/compose variables and command substitution
      placeholder = re.compile(r"\$\(|\$\{|\$[A-Z_]+|change-?me|example|xxx|\.\.\.", re.I)
      allow = ("tests/", "seed_demo.py", "seed.py", ".gitlab-ci.yml", "docs/", "README")
      hits = []
      for f in files:
          if f.endswith((".png", ".jpg", ".ico", ".lock")) or any(a in f for a in allow):
              continue
          try:
              text = open(f, encoding="utf-8", errors="ignore").read()
          except OSError:
              continue
          for rx, label in patterns:
              for m in rx.finditer(text):
                  if placeholder.search(m.group(0)):
                      continue
                  hits.append(f"{f}: {label} -> {m.group(0)[:60]}")
      if hits:
          print("Possible secrets found in the repository:")
          print("\n".join(hits))
          sys.exit(1)
      print("No secrets found in tracked files.")
      PY

# ---------------------------------------------------------------- build

docker-build:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    # Without TLS on port 2375; with DOCKER_TLS_CERTDIR the daemon listens on
    # 2376 and the client would reach into the void.
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t permitra-backend:$CI_COMMIT_SHORT_SHA backend
    - docker build -t permitra-frontend:$CI_COMMIT_SHORT_SHA frontend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # Requires a runner in privileged mode (Docker-in-Docker). If none is
  # available, the job reports that but does not block the pipeline.
  allow_failure: true
