services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: permitra
      POSTGRES_USER: permitra
      POSTGRES_PASSWORD: ${DB_PASSWORD:-permitra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permitra"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://permitra:${DB_PASSWORD:-permitra}@db:5432/permitra
      SECRET_KEY: ${SECRET_KEY:-please-change-me-in-production}
      # Demo-/Testbetrieb: legt die bekannten Demo-Benutzer an. In Produktion
      # NICHT setzen – dann entsteht ein Erst-Admin mit Zufallspasswort (Log).
      PERMITRA_DEMO: ${PERMITRA_DEMO:-}
      # E-Mail-Versand (leer = aus) und Basis-URL für Links in Mails
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PERMITRA_BASE_URL: ${PERMITRA_BASE_URL:-}
      # WebAuthn/Passkeys (Default: aus PERMITRA_BASE_URL abgeleitet)
      PERMITRA_RP_ID: ${PERMITRA_RP_ID:-}
      PERMITRA_ORIGIN: ${PERMITRA_ORIGIN:-}
      # Change-Management-Webhook (z.B. ServiceNow)
      CHANGE_WEBHOOK_URL: ${CHANGE_WEBHOOK_URL:-}
      CHANGE_WEBHOOK_TOKEN: ${CHANGE_WEBHOOK_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    # Für den Excel-Import: das data-Verzeichnis in den Container mounten
    volumes:
      - ./data:/data:ro

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
