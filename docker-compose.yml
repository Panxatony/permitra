services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: permitra
      POSTGRES_USER: permitra
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permitra"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      # Keine Fallback-Werte: fehlt SECRET_KEY, verweigert die App den Start
      # (fail-secure, app/auth.py). Ein bekannter Default würde fälschbare
      # Admin-Tokens erlauben. Werte in .env setzen (siehe .env.example).
      DATABASE_URL: postgresql+psycopg2://permitra:${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}@db:5432/permitra
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY muss gesetzt sein (openssl rand -hex 32)}
      # Demo-/Testbetrieb: legt die bekannten Demo-Benutzer an. In Produktion
      # NICHT setzen – dann entsteht ein Erst-Admin mit Zufallspasswort (Log).
      PERMITRA_DEMO: ${PERMITRA_DEMO:-}
      # E-Mail-Versand (leer = aus) und Basis-URL für Links in Mails
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PERMITRA_BASE_URL: ${PERMITRA_BASE_URL:-}
      # WebAuthn/Passkeys (Default: aus PERMITRA_BASE_URL abgeleitet)
      PERMITRA_RP_ID: ${PERMITRA_RP_ID:-}
      PERMITRA_ORIGIN: ${PERMITRA_ORIGIN:-}
      # Change-Management-Webhook (z.B. ServiceNow)
      CHANGE_WEBHOOK_URL: ${CHANGE_WEBHOOK_URL:-}
      CHANGE_WEBHOOK_TOKEN: ${CHANGE_WEBHOOK_TOKEN:-}
      # SIEM-Anbindung des Audit-Logs (leer = aus). Ist ein Ziel gesetzt, werden
      # Ereignisse persistent vorgemerkt und zuverlässig zugestellt (at-least-once).
      AUDIT_WEBHOOK_URL: ${AUDIT_WEBHOOK_URL:-}
      AUDIT_SYSLOG_HOST: ${AUDIT_SYSLOG_HOST:-}
      AUDIT_SYSLOG_PORT: ${AUDIT_SYSLOG_PORT:-514}
      AUDIT_SYSLOG_PROTO: ${AUDIT_SYSLOG_PROTO:-udp}
      # Abstand der Verankerungen des Ketten-Endes (Sekunden)
      AUDIT_CHECKPOINT_INTERVAL: ${AUDIT_CHECKPOINT_INTERVAL:-3600}
    depends_on:
      db:
        condition: service_healthy
    # Für den Excel-Import: das data-Verzeichnis in den Container mounten
    volumes:
      - ./data:/data:ro

  frontend:
    environment:
      # Kommagetrennte IPs/CIDRs eines vorgelagerten Reverse-Proxys. Nur von
      # diesen Adressen wird X-Forwarded-For ausgewertet – die Quell-IP landet
      # im Audit-Log und wäre sonst vom Client frei erfindbar. Leer lassen,
      # wenn der Container direkt veröffentlicht ist.
      PERMITRA_TRUSTED_PROXIES: ${PERMITRA_TRUSTED_PROXIES:-}
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
