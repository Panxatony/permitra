services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: permitra
      POSTGRES_USER: permitra
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permitra"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      # No fallback values: if SECRET_KEY is missing, the app refuses to start
      # (fail-secure, app/auth.py). A well-known default would allow forgeable
      # admin tokens. Set the values in .env (see .env.example).
      # skipcq: SCT-A000 - a variable reference, not a password; the text after
      # ':?' is the error compose prints when it is unset.
      DATABASE_URL: postgresql+psycopg2://permitra:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/permitra
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (openssl rand -hex 32)}
      # Demo/test operation: creates the well-known demo users. Do NOT set this
      # in production – an initial admin with a random password is created (log).
      PERMITRA_DEMO: ${PERMITRA_DEMO:-}
      # First-start admin: supply the password yourself, or leave both empty and
      # the backend writes a random one to /app/initial-admin-password.txt inside
      # the container. Found while walking the first run (#67): the variable was
      # documented but never passed through here, so setting it in .env silently
      # did nothing and the operator went hunting for a file instead.
      PERMITRA_INITIAL_ADMIN_PASSWORD: ${PERMITRA_INITIAL_ADMIN_PASSWORD:-}
      PERMITRA_INITIAL_ADMIN_PASSWORD_FILE: ${PERMITRA_INITIAL_ADMIN_PASSWORD_FILE:-}
      # Email delivery (empty = off) and base URL for links in emails
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PERMITRA_BASE_URL: ${PERMITRA_BASE_URL:-}
      # WebAuthn/passkeys (default: derived from PERMITRA_BASE_URL)
      PERMITRA_RP_ID: ${PERMITRA_RP_ID:-}
      PERMITRA_ORIGIN: ${PERMITRA_ORIGIN:-}
      # Change management webhook (e.g. ServiceNow)
      CHANGE_WEBHOOK_URL: ${CHANGE_WEBHOOK_URL:-}
      CHANGE_WEBHOOK_TOKEN: ${CHANGE_WEBHOOK_TOKEN:-}
      # SIEM connection for the audit log (empty = off). If a target is set,
      # events are queued persistently and delivered reliably (at-least-once).
      AUDIT_WEBHOOK_URL: ${AUDIT_WEBHOOK_URL:-}
      AUDIT_SYSLOG_HOST: ${AUDIT_SYSLOG_HOST:-}
      AUDIT_SYSLOG_PORT: ${AUDIT_SYSLOG_PORT:-514}
      AUDIT_SYSLOG_PROTO: ${AUDIT_SYSLOG_PROTO:-udp}
      # Interval between anchorings of the chain end (seconds)
      AUDIT_CHECKPOINT_INTERVAL: ${AUDIT_CHECKPOINT_INTERVAL:-3600}
    depends_on:
      db:
        condition: service_healthy
    # For the Excel import: mount the data directory into the container
    volumes:
      - ./data:/data:ro

  frontend:
    environment:
      # Comma-separated IPs/CIDRs of an upstream reverse proxy. X-Forwarded-For
      # is only evaluated from these addresses – the source IP ends up in the
      # audit log and could otherwise be made up freely by the client. Leave
      # empty if the container is published directly.
      PERMITRA_TRUSTED_PROXIES: ${PERMITRA_TRUSTED_PROXIES:-}
      PERMITRA_LOGIN_RATE: ${PERMITRA_LOGIN_RATE:-}
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
