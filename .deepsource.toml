# DeepSource configuration.
#
# Without this file DeepSource knows the repository but does not know what to
# run against it - which is why analysis had never started.
#
# Three static checks now look at this code, and they are not redundant:
#   - ruff (in CI, blocking) is fast and tuned to this project; it is the one
#     that stops a merge.
#   - DeepSource is broad and cross-language - it also reaches the Dockerfiles,
#     the shell scripts and the secret patterns that ruff never sees.
#   - CodeQL follows taint from a request into a query, a path or a subprocess.
# If the volume of findings ever gets in the way, drop CodeQL first: it is the
# narrowest of the three and the only one whose findings do not appear inline.

version = 1

# The tests exercise error paths on purpose - asserting on a raised exception,
# building deliberately malformed input. Marked as tests, DeepSource judges them
# by test conventions instead of flagging the intent as a defect.
test_patterns = [
  "backend/tests/**",
]

exclude_patterns = [
  # Generated by Alembic and edited only to be corrected; style findings here
  # would be noise, and the migrations are verified by running them in CI.
  "backend/alembic/versions/**",
  # Generated example exports, not source.
  "examples/**",
  "frontend/dist/**",
  "data/**",
]

[[analyzers]]
name = "python"

  [analyzers.meta]
  runtime_version = "3.x.x"
  max_line_length = 120   # matches line-length in backend/ruff.toml, so the two do not disagree

[[analyzers]]
name = "javascript"

  [analyzers.meta]
  plugins = ["react"]
  environment = ["browser"]
  dialect = "javascript"
  module_system = "es-modules"

# Reaches what the Python and JavaScript analyzers do not: the container images
# both services are shipped as.
[[analyzers]]
name = "docker"

# Permitra manages firewall rules; a credential reaching this repository is the
# kind of mistake that is expensive to undo once it is public. scripts/
# secret_scan.py already blocks the obvious patterns in CI - this catches the
# shapes a hand-written regex does not know about.
[[analyzers]]
name = "secrets"

# scripts/backup.sh and the two nginx entrypoints run as root inside the
# container, so a quoting mistake there matters more than usual.
[[analyzers]]
name = "shell"
