# CI for Permitra on GitHub.
#
# This mirrors .gitlab-ci.yml deliberately, job for job. GitLab is where this
# project is developed and deployed from; GitHub is where it is public, and a
# pull request there has to be checked by something. Two definitions can drift,
# so when a check changes in one, change it in the other - the comment is here
# rather than in a wiki because this is the file someone will be editing.
#
# The backend tests run twice: once quickly against SQLite, once against a real
# PostgreSQL including the Alembic migrations. That second run exists because
# SQLite hides dialect and migration errors - it has caught two of them so far.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege: nothing here writes to the repository. A workflow that only
# needs to read the code should not carry a token that can push to it.
permissions:
  contents: read

# A newer push supersedes a running check of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # Keep in step with backend/Dockerfile. If they drift, CI proves the
          # tests pass on a runtime that is not the one being shipped.
          python-version: '3.14'
      - run: pip install --quiet ruff
      # Rules and exceptions live in backend/ruff.toml - the default rule set
      # drowns real findings in FastAPI idiom (Depends in default arguments).
      # Blocking on purpose: the tree is clean, so a new finding is a real one.
      - run: ruff check . --output-format=concise
        working-directory: backend
      # The browser checks are Python too, and just as able to rot.
      - run: ruff check e2e --output-format=concise --config backend/ruff.toml

  backend-tests:
    name: backend tests (SQLite)
    runs-on: ubuntu-latest
    env:
      PERMITRA_DEV: '1'   # random per-process secret instead of a real SECRET_KEY
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # Keep in step with backend/Dockerfile. If they drift, CI proves the
          # tests pass on a runtime that is not the one being shipped.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --quiet -r backend/requirements-dev.txt
      - run: python -m pytest tests/ -q --cov=app --cov-report=term --junitxml=report.xml
        working-directory: backend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-report
          path: backend/report.xml
          retention-days: 7

  migrations-postgres:
    name: migrations & audit chain (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: permitra_ci
          POSTGRES_USER: permitra
          POSTGRES_PASSWORD: ci-only-not-secret
        ports: ['5432:5432']
        # Without the health check the first migration races the database.
        options: >-
          --health-cmd "pg_isready -U permitra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://permitra:ci-only-not-secret@localhost:5432/permitra_ci
      PERMITRA_DEV: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # Keep in step with backend/Dockerfile. If they drift, CI proves the
          # tests pass on a runtime that is not the one being shipped.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --quiet -r backend/requirements-dev.txt

      - name: Apply migrations from scratch
        working-directory: backend
        run: python -c "from app.migrations import run_migrations; run_migrations(); print('Migrations applied')"

      - name: Audit hash chain on real PostgreSQL
        working-directory: backend
        # The chain uses an advisory lock to serialise writers. That path does
        # not exist on SQLite, so it is only ever exercised here.
        run: |
          python - <<'PY'
          from app.database import SessionLocal
          from app import audit
          db = SessionLocal()
          for i in range(25):
              audit.record(db, "admin", "ci.check", actor="ci", object=f"o{i}", detail="x")
          result = audit.verify_chain(db)
          assert result["ok"], f"hash chain broken: {result}"
          assert result["checked"] == 25, result
          print("Audit hash chain on PostgreSQL: ok")
          db.close()
          PY

  backup-restore:
    name: backup & restore round trip
    runs-on: ubuntu-latest
    # The point of this job: a backup that has never been restored is a guess.
    # It dumps a migrated database, encrypts it, restores it into a second one
    # and then asks the question that matters - does the audit chain still
    # verify? If the dump had been truncated, or rows had come back in a
    # different order, that check fails and the backup is worthless for exactly
    # the purpose it is kept for.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: permitra_ci
          POSTGRES_USER: permitra
          POSTGRES_PASSWORD: ci-only-not-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U permitra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SRC_URL: postgresql://permitra:ci-only-not-secret@localhost:5432/permitra_ci
      DST_URL: postgresql://permitra:ci-only-not-secret@localhost:5432/permitra_restored
      PERMITRA_DEV: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # Keep in step with backend/Dockerfile. If they drift, CI proves the
          # tests pass on a runtime that is not the one being shipped.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --quiet -r backend/requirements-dev.txt

      - name: Client version must match the server
        # A pg_dump newer than the server emits statements the server rejects,
        # and the restore stops on the first one. The scripts warn about it;
        # here it simply must not happen.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 >/dev/null
          pg_dump --version

      - name: Seed a database with audit events
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://permitra:ci-only-not-secret@localhost:5432/permitra_ci
        run: |
          python - <<'PY'
          from app.migrations import run_migrations
          run_migrations()
          from app.database import SessionLocal
          from app import audit
          db = SessionLocal()
          for i in range(40):
              audit.record(db, "admin", "ci.backup", actor="ci", object=f"o{i}", detail="x")
          db.close()
          print("seeded")
          PY

      - name: Back up, encrypted
        run: |
          mkdir -p "$RUNNER_TEMP/keys" "$RUNNER_TEMP/backups"
          echo "ci-only-passphrase" > "$RUNNER_TEMP/keys/backup.key"
          PERMITRA_PG_URL="$SRC_URL" \
          PERMITRA_BACKUP_PASSPHRASE_FILE="$RUNNER_TEMP/keys/backup.key" \
            ./scripts/backup.sh "$RUNNER_TEMP/backups"

      - name: The dump must not be readable
        # Guards the whole point of the change: if encryption silently stopped
        # happening, the file would still be a valid backup and nobody would
        # notice until it was copied somewhere it should not have been.
        run: |
          FILE=$(ls -1 "$RUNNER_TEMP"/backups/permitra-*.sql.gz.gpg)
          echo "encrypted file: $FILE"
          if zgrep -q "CREATE TABLE" "$FILE" 2>/dev/null || grep -qa "CREATE TABLE" "$FILE"; then
            echo "::error::the backup contains readable SQL" && exit 1
          fi

      - name: Refuse to overwrite a populated database
        run: |
          FILE=$(ls -1 "$RUNNER_TEMP"/backups/permitra-*.sql.gz.gpg)
          if PERMITRA_PG_URL="$SRC_URL" \
             PERMITRA_BACKUP_PASSPHRASE_FILE="$RUNNER_TEMP/keys/backup.key" \
             ./scripts/restore.sh "$FILE" >/dev/null 2>&1; then
            echo "::error::restore overwrote a populated database without --force" && exit 1
          fi
          echo "refused, as it should"

      - name: Restore into a fresh database and verify the audit chain
        run: |
          PGPASSWORD=ci-only-not-secret createdb -h localhost -U permitra permitra_restored
          FILE=$(ls -1 "$RUNNER_TEMP"/backups/permitra-*.sql.gz.gpg)
          PERMITRA_PG_URL="$DST_URL" \
          PERMITRA_BACKUP_PASSPHRASE_FILE="$RUNNER_TEMP/keys/backup.key" \
            ./scripts/restore.sh "$FILE"

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # Keep in step with frontend/Dockerfile, same reason.
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: end-to-end (browser)
    runs-on: ubuntu-latest
    # The slowest job here, because a whole stack has to come up. It buys the
    # one thing nothing else in this pipeline can say: the interface runs. A
    # component calling t() without useLang() builds cleanly and fails when it
    # mounts; a React major bundles fine and then behaves differently. Both
    # happened, and neither was caught by a build.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # Keep in step with backend/Dockerfile. If they drift, CI proves the
          # tests pass on a runtime that is not the one being shipped.
          python-version: '3.14'

      - name: Start the stack with demo data
        env:
          # Throwaway values for a stack that lives for two minutes.
          DB_PASSWORD: ci-only-not-secret
          SECRET_KEY: ci-only-not-secret-key-0123456789abcdef
          PERMITRA_DEMO: '1'
          FRONTEND_PORT: '8090'
        run: |
          docker compose up -d --build
          # Wait for the API rather than sleeping: the backend runs migrations
          # and seeding at startup, and how long that takes is not fixed.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8090/api/settings/public >/dev/null; then
              echo "up after ${i}s" && break
            fi
            sleep 1
          done
          curl -sf http://localhost:8090/api/settings/public
          docker compose exec -T backend python seed_demo.py --wipe

      - name: Install the browser
        run: |
          pip install --quiet -r e2e/requirements.txt
          playwright install --with-deps chromium

      - name: Run the checks
        run: pytest e2e/ -q --junitxml=e2e-report.xml

      - name: What the containers said, if it failed
        if: failure()
        run: docker compose logs --tail 80

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: e2e-report.xml
          retention-days: 7

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # Reports known vulnerabilities without blocking: an advisory published in a
    # transitive dependency should be visible, not a reason a correct change
    # cannot be merged. The report is what matters.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # Keep in step with backend/Dockerfile. If they drift, CI proves the
          # tests pass on a runtime that is not the one being shipped.
          python-version: '3.14'
      - run: pip install --quiet pip-audit
      - run: pip-audit -r backend/requirements.txt --progress-spinner off
      - uses: actions/setup-node@v7
        with:
          # Keep in step with frontend/Dockerfile, same reason.
          node-version: '26'
      - run: npm audit --audit-level=high
        working-directory: frontend

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # Keep in step with backend/Dockerfile. If they drift, CI proves the
          # tests pass on a runtime that is not the one being shipped.
          python-version: '3.14'
      - name: No secret may end up in the repository
        run: python scripts/secret_scan.py

  docker-build:
    name: docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Plain docker build, no registry push: this checks that the Dockerfiles
      # still work, which is what breaks. Publishing images is a release step,
      # not a per-commit one.
      - run: docker build -t permitra-backend:${{ github.sha }} backend
      - run: docker build -t permitra-frontend:${{ github.sha }} frontend
