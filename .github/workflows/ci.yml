# CI for Permitra on GitHub.
#
# This mirrors .gitlab-ci.yml deliberately, job for job. GitLab is where this
# project is developed and deployed from; GitHub is where it is public, and a
# pull request there has to be checked by something. Two definitions can drift,
# so when a check changes in one, change it in the other - the comment is here
# rather than in a wiki because this is the file someone will be editing.
#
# The backend tests run twice: once quickly against SQLite, once against a real
# PostgreSQL including the Alembic migrations. That second run exists because
# SQLite hides dialect and migration errors - it has caught two of them so far.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege: nothing here writes to the repository. A workflow that only
# needs to read the code should not carry a token that can push to it.
permissions:
  contents: read

# A newer push supersedes a running check of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet ruff
      # Rules and exceptions live in backend/ruff.toml - the default rule set
      # drowns real findings in FastAPI idiom (Depends in default arguments).
      # Blocking on purpose: the tree is clean, so a new finding is a real one.
      - run: ruff check . --output-format=concise
        working-directory: backend

  backend-tests:
    name: backend tests (SQLite)
    runs-on: ubuntu-latest
    env:
      PERMITRA_DEV: '1'   # random per-process secret instead of a real SECRET_KEY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --quiet -r backend/requirements-dev.txt
      - run: python -m pytest tests/ -q --cov=app --cov-report=term --junitxml=report.xml
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: backend/report.xml
          retention-days: 7

  migrations-postgres:
    name: migrations & audit chain (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: permitra_ci
          POSTGRES_USER: permitra
          POSTGRES_PASSWORD: ci-only-not-secret
        ports: ['5432:5432']
        # Without the health check the first migration races the database.
        options: >-
          --health-cmd "pg_isready -U permitra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://permitra:ci-only-not-secret@localhost:5432/permitra_ci
      PERMITRA_DEV: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --quiet -r backend/requirements-dev.txt

      - name: Apply migrations from scratch
        working-directory: backend
        run: python -c "from app.migrations import run_migrations; run_migrations(); print('Migrations applied')"

      - name: Audit hash chain on real PostgreSQL
        working-directory: backend
        # The chain uses an advisory lock to serialise writers. That path does
        # not exist on SQLite, so it is only ever exercised here.
        run: |
          python - <<'PY'
          from app.database import SessionLocal
          from app import audit
          db = SessionLocal()
          for i in range(25):
              audit.record(db, "admin", "ci.check", actor="ci", object=f"o{i}", detail="x")
          result = audit.verify_chain(db)
          assert result["ok"], f"hash chain broken: {result}"
          assert result["checked"] == 25, result
          print("Audit hash chain on PostgreSQL: ok")
          db.close()
          PY

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # Reports known vulnerabilities without blocking: an advisory published in a
    # transitive dependency should be visible, not a reason a correct change
    # cannot be merged. The report is what matters.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pip-audit
      - run: pip-audit -r backend/requirements.txt --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm audit --audit-level=high
        working-directory: frontend

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No secret may end up in the repository
        run: python scripts/secret_scan.py

  docker-build:
    name: docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Plain docker build, no registry push: this checks that the Dockerfiles
      # still work, which is what breaks. Publishing images is a release step,
      # not a per-commit one.
      - run: docker build -t permitra-backend:${{ github.sha }} backend
      - run: docker build -t permitra-frontend:${{ github.sha }} frontend
